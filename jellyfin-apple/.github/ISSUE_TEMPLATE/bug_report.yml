name: Bug report
description: Something in Marquee doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more precise the reproduction, the faster it gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap/select …
        3. See …
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - tvOS
        - Both
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. iOS 26.1, tvOS 26.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. iPhone 16 Pro, Apple TV 4K (3rd gen)"
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version / build
      placeholder: "Settings → About, or the build you're running"
    validations:
      required: false

  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      placeholder: "e.g. 10.9.11 — shown on the server's Dashboard"
    validations:
      required: true

  - type: dropdown
    id: playback-method
    attributes:
      label: Playback method (only for playback bugs)
      description: Visible in the server's active session / dashboard if unsure. Leave the default if this isn't a playback bug.
      options:
        - Not applicable
        - Direct play
        - Direct stream (remux)
        - Transcode (HLS)
        - Live TV
        - Unknown
      default: 0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or screen recording
      description: Console output, a screenshot, or a screen recording helps a lot, especially for layout or focus bugs on tvOS.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't already been reported.
          required: true
