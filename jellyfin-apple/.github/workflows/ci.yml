name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: JellyfinKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | tail -n 1)"
      - name: Run tests
        run: swift test --package-path Packages/JellyfinKit

  build-apps:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    needs: package-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Marquee
            destination: generic/platform=iOS Simulator
          - scheme: Marquee TV
            destination: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | tail -n 1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project Marquee.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
