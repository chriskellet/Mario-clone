<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Clone - Tests</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-suite {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-case {
            padding: 10px;
            margin: 5px 0;
            border-left: 4px solid #ccc;
            background: #f9f9f9;
        }
        .test-case.pass {
            border-left-color: #4caf50;
            background: #e8f5e9;
        }
        .test-case.fail {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .test-case.pending {
            border-left-color: #ff9800;
            background: #fff3e0;
        }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 0; }
        .summary {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 4px;
        }
        .error-details {
            color: #c62828;
            font-size: 12px;
            margin-top: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Mario Clone - Test Suite</h1>
    <div id="test-results"></div>

    <script>
        const testResults = [];

        class TestRunner {
            constructor(suiteName) {
                this.suiteName = suiteName;
                this.tests = [];
            }

            test(name, fn) {
                this.tests.push({ name, fn });
            }

            async run() {
                console.log(`\n=== Running ${this.suiteName} ===`);
                const results = [];

                for (const test of this.tests) {
                    try {
                        await test.fn();
                        results.push({ name: test.name, status: 'pass' });
                        console.log(`✓ ${test.name}`);
                    } catch (error) {
                        results.push({ name: test.name, status: 'fail', error: error.message });
                        console.error(`✗ ${test.name}: ${error.message}`);
                    }
                }

                return { suite: this.suiteName, results };
            }
        }

        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(message || `Expected ${expected}, got ${actual}`);
            }
        }

        // Test Suite 1: DOM Elements
        const domTests = new TestRunner('DOM Elements');

        domTests.test('Game canvas exists', () => {
            const canvas = document.getElementById('gameCanvas');
            assert(canvas, 'Canvas element not found');
            assert(canvas.tagName === 'CANVAS', 'Element is not a canvas');
        });

        domTests.test('Touch control buttons exist', () => {
            const leftBtn = document.getElementById('btn-left');
            const rightBtn = document.getElementById('btn-right');
            const jumpBtn = document.getElementById('btn-jump');

            assert(leftBtn, 'Left button not found');
            assert(rightBtn, 'Right button not found');
            assert(jumpBtn, 'Jump button not found');
        });

        domTests.test('Start screen exists', () => {
            const startScreen = document.getElementById('start-screen');
            const startBtn = document.getElementById('start-btn');

            assert(startScreen, 'Start screen not found');
            assert(startBtn, 'Start button not found');
        });

        domTests.test('Game UI elements exist', () => {
            const score = document.getElementById('score');
            const coins = document.getElementById('coins');
            const lives = document.getElementById('lives');

            assert(score, 'Score element not found');
            assert(coins, 'Coins element not found');
            assert(lives, 'Lives element not found');
        });

        // Test Suite 2: Game State
        const gameStateTests = new TestRunner('Game State');

        gameStateTests.test('gameState object exists', () => {
            assert(typeof gameState !== 'undefined', 'gameState not defined');
            assert(typeof gameState === 'object', 'gameState is not an object');
        });

        gameStateTests.test('gameState has required properties', () => {
            assert('running' in gameState, 'gameState missing running property');
            assert('score' in gameState, 'gameState missing score property');
            assert('coins' in gameState, 'gameState missing coins property');
            assert('lives' in gameState, 'gameState missing lives property');
            assert('touchControls' in gameState, 'gameState missing touchControls property');
        });

        gameStateTests.test('touchControls initialized correctly', () => {
            assert('left' in gameState.touchControls, 'touchControls missing left');
            assert('right' in gameState.touchControls, 'touchControls missing right');
            assert('jump' in gameState.touchControls, 'touchControls missing jump');
        });

        // Test Suite 3: Configuration
        const configTests = new TestRunner('Configuration');

        configTests.test('CONFIG object exists', () => {
            assert(typeof CONFIG !== 'undefined', 'CONFIG not defined');
        });

        configTests.test('CONFIG has physics properties', () => {
            assert('GRAVITY' in CONFIG, 'CONFIG missing GRAVITY');
            assert('JUMP_POWER' in CONFIG, 'CONFIG missing JUMP_POWER');
            assert('MOVE_SPEED' in CONFIG, 'CONFIG missing MOVE_SPEED');
        });

        configTests.test('Jump power is reasonable', () => {
            assert(CONFIG.JUMP_POWER < 0, 'Jump power should be negative');
            assert(CONFIG.JUMP_POWER >= -15, 'Jump power too large');
        });

        configTests.test('Running is faster than walking', () => {
            assert(CONFIG.RUN_SPEED > CONFIG.MOVE_SPEED, 'RUN_SPEED should exceed MOVE_SPEED');
        });

        configTests.test('Game-feel windows are set', () => {
            assert(CONFIG.COYOTE_TIME > 0, 'CONFIG missing coyote time');
            assert(CONFIG.JUMP_BUFFER > 0, 'CONFIG missing jump buffer');
            assert(CONFIG.JUMP_CUT > 0 && CONFIG.JUMP_CUT < 1, 'JUMP_CUT should be a fraction');
        });

        configTests.test('Nothing can fall faster than a sub-step', () => {
            // Sub-stepped movement is what stops entities tunnelling through
            // thin platforms, so terminal velocity must stay within reach of it.
            assert(CONFIG.MAX_FALL_SPEED > 0, 'MAX_FALL_SPEED must be positive');
            assert(CONFIG.MAX_FALL_SPEED < 100, 'MAX_FALL_SPEED implausibly large');
        });

        // Test Suite 4: Functions
        const functionTests = new TestRunner('Functions');

        functionTests.test('startGame function exists', () => {
            assert(typeof startGame === 'function', 'startGame is not a function');
        });

        functionTests.test('setupTouchControls function exists', () => {
            assert(typeof setupTouchControls === 'function', 'setupTouchControls is not a function');
        });

        functionTests.test('initLevel function exists', () => {
            assert(typeof initLevel === 'function', 'initLevel is not a function');
        });

        // Test Suite 5: Audio
        const audioTests = new TestRunner('Audio System');

        audioTests.test('Audio context exists', () => {
            assert(typeof audioContext !== 'undefined', 'audioContext not defined');
        });

        audioTests.test('Sound functions exist', () => {
            assert(typeof sounds === 'object', 'sounds object not found');
            assert(typeof sounds.jump === 'function', 'jump sound not found');
            assert(typeof sounds.coin === 'function', 'coin sound not found');
        });

        // Test Suite 6: Haptics
        const hapticTests = new TestRunner('Haptics System');

        hapticTests.test('Haptics object exists', () => {
            assert(typeof haptics === 'object', 'haptics object not found');
        });

        hapticTests.test('Haptic functions exist', () => {
            assert(typeof haptics.light === 'function', 'light haptic not found');
            assert(typeof haptics.medium === 'function', 'medium haptic not found');
            assert(typeof haptics.heavy === 'function', 'heavy haptic not found');
        });

        // Test Suite 7: Geometry helpers
        const mathTests = new TestRunner('Geometry Helpers');

        mathTests.test('clamp keeps values in range', () => {
            assertEqual(clamp(5, 0, 10), 5);
            assertEqual(clamp(-5, 0, 10), 0);
            assertEqual(clamp(15, 0, 10), 10);
        });

        mathTests.test('lerp interpolates', () => {
            assertEqual(lerp(0, 10, 0), 0);
            assertEqual(lerp(0, 10, 1), 10);
            assertEqual(lerp(0, 10, 0.5), 5);
        });

        mathTests.test('overlaps detects intersection', () => {
            const a = { x: 0, y: 0, width: 10, height: 10 };
            assert(overlaps(a, { x: 5, y: 5, width: 10, height: 10 }), 'should overlap');
            assert(!overlaps(a, { x: 20, y: 0, width: 10, height: 10 }), 'should not overlap');
        });

        mathTests.test('touching edges do not count as overlapping', () => {
            // Standing flush against a wall must not read as being inside it.
            const a = { x: 0, y: 0, width: 10, height: 10 };
            assert(!overlaps(a, { x: 10, y: 0, width: 10, height: 10 }), 'flush edges overlap');
        });

        // Test Suite 8: Collision resolver
        const collisionTests = new TestRunner('Collision Resolver');

        const makeSolid = (x, y, w, h, oneWay = false) => ({ x, y, width: w, height: h, oneWay });
        const makeBody = (x, y, vx, vy) => ({
            x, y, width: 20, height: 20, velocityX: vx, velocityY: vy, onGround: false,
        });

        collisionTests.test('landing stops a falling body on top of a solid', () => {
            const floor = makeSolid(0, 100, 200, 20);
            const body = makeBody(50, 60, 0, 30);
            moveAndCollide(body, { solids: [floor] });
            assertEqual(body.y + body.height, 100, 'body should rest on the floor');
            assertEqual(body.velocityY, 0, 'vertical speed should be cancelled');
            assert(body.onGround, 'body should report standing');
        });

        collisionTests.test('terminal velocity does not tunnel through a thin platform', () => {
            // Falling far faster than the platform is thick: the sub-stepped
            // resolver has to catch it rather than skip past it.
            const thin = makeSolid(0, 300, 200, 8);
            const body = makeBody(50, 0, 0, 0);
            for (let i = 0; i < 60 && !body.onGround; i++) {
                body.velocityY = CONFIG.MAX_FALL_SPEED * 4;
                moveAndCollide(body, { solids: [thin] });
            }
            assert(body.onGround, 'body never landed');
            assertEqual(body.y + body.height, 300, 'body fell straight through');
        });

        collisionTests.test('walls stop horizontal movement', () => {
            const wall = makeSolid(100, 0, 20, 200);
            const body = makeBody(50, 50, 0, 0);
            let hit;
            for (let i = 0; i < 20; i++) {
                body.velocityX = 6;
                hit = moveAndCollide(body, { solids: [wall] });
            }
            assertEqual(hit.hitWall, 1, 'should report a right-hand wall hit');
            assertEqual(body.x + body.width, 100, 'body should stop at the wall');
        });

        collisionTests.test('ceilings are reported so blocks can be bumped', () => {
            const ceiling = makeSolid(0, 0, 200, 20);
            const body = makeBody(50, 40, 0, -30);
            const hit = moveAndCollide(body, { solids: [ceiling] });
            assert(hit.ceiling === ceiling, 'ceiling not reported');
            assertEqual(body.y, 20, 'body should be pushed below the ceiling');
        });

        collisionTests.test('one-way platforms catch a fall but not a rise', () => {
            const cloud = makeSolid(0, 100, 200, 10, true);

            const rising = makeBody(50, 150, 0, 0);
            for (let i = 0; i < 10; i++) {
                rising.velocityY = -12;
                moveAndCollide(rising, { solids: [cloud] });
            }
            assert(rising.y + rising.height < 100, 'rising body should pass through');

            const falling = makeBody(50, 40, 0, 0);
            for (let i = 0; i < 20 && !falling.onGround; i++) {
                falling.velocityY = 12;
                moveAndCollide(falling, { solids: [cloud] });
            }
            assertEqual(falling.y + falling.height, 100, 'falling body should land on it');
        });

        // Test Suite 9: Level construction
        const levelTests = new TestRunner('Level Construction');

        levelTests.test('initLevel builds a populated level', () => {
            initLevel();
            assert(platforms.length > 10, 'not enough platforms');
            assert(blocks.length > 0, 'no blocks');
            assert(coins.length > 0, 'no coins');
            assert(portals.length > 0, 'no enemy pipes');
            assert(enemies.length > 0, 'no enemies in single player');
            assert(flagpole, 'no flagpole in single player');
        });

        levelTests.test('the level is deterministic so multiplayer stays in sync', () => {
            initLevel();
            const first = coins.map(c => `${Math.round(c.x)},${Math.round(c.y)}`).join('|');
            initLevel();
            const second = coins.map(c => `${Math.round(c.x)},${Math.round(c.y)}`).join('|');
            assertEqual(first, second, 'coin layout differs between builds');
        });

        levelTests.test('coin indices are unique', () => {
            initLevel();
            const seen = new Set(coins.map(c => c.index));
            assertEqual(seen.size, coins.length, 'duplicate coin indices would break Firebase claims');
        });

        levelTests.test('the ground has gaps to fall into', () => {
            initLevel();
            const ground = platforms.filter(p => p.variant === 'ground').sort((a, b) => a.x - b.x);
            assert(ground.length > 1, 'ground should be split into segments');
            const hasGap = ground.some((seg, i) => i > 0 && seg.x > ground[i - 1].x + ground[i - 1].width);
            assert(hasGap, 'no pits found in the level');
        });

        levelTests.test('respawn points are never over a pit', () => {
            initLevel();
            for (let i = 0; i < 40; i++) {
                const spot = player.getRandomRespawnLocation();
                const supported = platforms.some(p =>
                    spot.x + player.width > p.x && spot.x < p.x + p.width && p.y >= spot.y);
                assert(supported, `respawn at ${Math.round(spot.x)} has nothing below it`);
            }
        });

        // Test Suite 10: Blocks and power-ups
        const blockTests = new TestRunner('Blocks and Power-ups');

        blockTests.test('a question block gives up one item per hit', () => {
            initLevel();
            const block = new Block(0, 0, 'question', 'coin', 2);
            const big = { health: 2 };
            block.onBump(big);
            assertEqual(block.count, 1, 'first hit should spend one item');
            block.bump = 0; block.bumpVelocity = 0;   // let the animation finish
            block.onBump(big);
            assertEqual(block.count, 0, 'second hit should empty it');
            assert(block.used, 'an empty block should look spent');
        });

        blockTests.test('an empty block cannot be milked', () => {
            const block = new Block(0, 0, 'question', 'coin', 1);
            const big = { health: 2 };
            block.onBump(big);
            block.bump = 0; block.bumpVelocity = 0;
            const before = gameState.score;
            block.onBump(big);
            assertEqual(gameState.score, before, 'a spent block still paid out');
        });

        blockTests.test('a mid-bounce block ignores repeat hits', () => {
            const block = new Block(0, 0, 'question', 'coin', 3);
            const big = { health: 2 };
            block.onBump(big);
            block.onBump(big);            // same jump, no animation reset
            assertEqual(block.count, 2, 'one jump should count as one hit');
        });

        blockTests.test('only a big player smashes bricks', () => {
            const brick = new Block(0, 0, 'brick', null);
            brick.onBump({ health: 1 });
            assert(!brick.destroyed, 'small player should not smash a brick');
            brick.bump = 0; brick.bumpVelocity = 0;
            brick.onBump({ health: 2 });
            assert(brick.destroyed, 'big player should smash a brick');
        });

        blockTests.test('mushroom blocks sprout a power-up', () => {
            initLevel();
            const before = powerUps.length;
            new Block(100, 100, 'question', 'mushroom', 1).onBump({ health: 1 });
            assert(powerUps.length === before + 1, 'no power-up appeared');
        });

        // Test Suite 11: Level geometry
        // Hand-placed levels drift into 20 and 30px slots that look like
        // openings but are too tight to walk into. These checks keep the
        // layout honest: everything sits on the grid, and every gap is either
        // genuinely passable or genuinely solid.
        const geometryTests = new TestRunner('Level Geometry');

        function levelSolids() {
            initLevel();
            rebuildSolids();
            return solidCache.slice();
        }

        const describe = s => `${s.variant || s.type || 'pipe'}@(${Math.round(s.x)},${Math.round(s.y)})`;

        geometryTests.test('no two solids occupy the same space', () => {
            const solids = levelSolids();
            const clashes = [];
            for (let i = 0; i < solids.length; i++) {
                for (let j = i + 1; j < solids.length; j++) {
                    if (overlaps(solids[i], solids[j])) {
                        clashes.push(`${describe(solids[i])} / ${describe(solids[j])}`);
                    }
                }
            }
            assert(clashes.length === 0, `overlapping solids: ${clashes.slice(0, 3).join(', ')}`);
        });

        geometryTests.test('no gap is too narrow to walk into', () => {
            const solids = levelSolids();
            const width = CONFIG.PLAYER_SIZE;
            const bad = [];
            for (let i = 0; i < solids.length; i++) {
                for (let j = i + 1; j < solids.length; j++) {
                    const a = solids[i], b = solids[j];
                    if (!(a.y < b.y + b.height && a.y + a.height > b.y)) continue;
                    const left = a.x < b.x ? a : b;
                    const right = a.x < b.x ? b : a;
                    const gap = right.x - (left.x + left.width);
                    if (gap <= 0 || gap >= width) continue;
                    const y0 = Math.max(a.y, b.y), y1 = Math.min(a.y + a.height, b.y + b.height);
                    const filled = solids.some(s => s !== a && s !== b &&
                        s.x < right.x && s.x + s.width > left.x + left.width &&
                        s.y < y1 && s.y + s.height > y0);
                    if (!filled) bad.push(`${Math.round(gap)}px at ${describe(left)}`);
                }
            }
            assert(bad.length === 0, `unwalkable slots: ${bad.slice(0, 3).join(', ')}`);
        });

        geometryTests.test('no tunnel is too short to fit under', () => {
            const solids = levelSolids();
            const height = CONFIG.PLAYER_SIZE;
            const bad = [];
            for (let i = 0; i < solids.length; i++) {
                for (let j = i + 1; j < solids.length; j++) {
                    const a = solids[i], b = solids[j];
                    if (!(a.x < b.x + b.width && a.x + a.width > b.x)) continue;
                    const top = a.y < b.y ? a : b;
                    const bottom = a.y < b.y ? b : a;
                    const gap = bottom.y - (top.y + top.height);
                    if (gap <= 0 || gap >= height) continue;
                    const x0 = Math.max(a.x, b.x), x1 = Math.min(a.x + a.width, b.x + b.width);
                    const filled = solids.some(s => s !== a && s !== b &&
                        s.x < x1 && s.x + s.width > x0 &&
                        s.y < bottom.y && s.y + s.height > top.y + top.height);
                    if (!filled) bad.push(`${Math.round(gap)}px under ${describe(top)}`);
                }
            }
            assert(bad.length === 0, `crawlspaces: ${bad.slice(0, 3).join(', ')}`);
        });

        geometryTests.test('every exposed surface has somewhere to stand', () => {
            const solids = levelSolids();
            const size = CONFIG.PLAYER_SIZE;
            const bad = [];
            for (const surface of solids) {
                if (surface.y > CONFIG.WORLD_HEIGHT || surface.width < 8) continue;
                // A block buried under the next stair has no exposed top.
                const buried = solids.some(s => s !== surface &&
                    s.x <= surface.x && s.x + s.width >= surface.x + surface.width &&
                    Math.abs(s.y + s.height - surface.y) < 1);
                if (buried) continue;

                let free = 0;
                for (let bx = surface.x - size + 4; bx <= surface.x + surface.width - 4; bx += 4) {
                    if (bx + size <= surface.x || bx >= surface.x + surface.width) continue;
                    const body = { x: bx, y: surface.y - size, width: size, height: size };
                    if (!solids.some(s => s !== surface && overlaps(body, s))) free++;
                }
                if (free === 0) bad.push(describe(surface));
            }
            assert(bad.length === 0, `nowhere to stand on: ${bad.slice(0, 3).join(', ')}`);
        });

        geometryTests.test('the layout sits on the grid', () => {
            initLevel();
            const offGrid = [...platforms, ...blocks]
                .filter(s => s.variant !== 'cloud')
                .filter(s => s.x % GRID !== 0 || s.width % GRID !== 0)
                .map(describe);
            assert(offGrid.length === 0, `off-grid: ${offGrid.slice(0, 3).join(', ')}`);
        });

        geometryTests.test('each tier is within one jump of the one below', () => {
            initLevel();
            // Measured jump height is ~158px; keep a margin so the level is
            // never gated behind a pixel-perfect running jump.
            const rise = 158;
            const heights = [TIER.ground, TIER.low, TIER.mid, TIER.high];
            for (let i = 1; i < heights.length; i++) {
                const climb = heights[i - 1] - heights[i];
                assert(climb < rise - 20, `tier ${i} needs a ${climb}px climb, jump clears ${rise}px`);
            }
        });

        geometryTests.test('every pit is jumpable', () => {
            initLevel();
            const ground = platforms.filter(p => p.variant === 'ground').sort((a, b) => a.x - b.x);
            // A running jump hangs for roughly 50 frames at 7.2px/frame.
            const reach = 50 * CONFIG.RUN_SPEED * 0.75;
            for (let i = 1; i < ground.length; i++) {
                const gap = ground[i].x - (ground[i - 1].x + ground[i - 1].width);
                assert(gap > 0, 'ground segments should not touch');
                assert(gap < reach, `a ${gap}px pit is wider than a ${Math.round(reach)}px jump`);
            }
        });

        // Test Suite 12: Death and respawn
        const deathTests = new TestRunner('Death and Respawn');

        deathTests.test('a lethal hit starts a death sequence instead of teleporting', () => {
            initLevel();
            player.health = 1;                 // shrinking recentres the box
            player.setInvulnerable(false);
            const spot = { x: player.x, y: player.y };
            player.hit();
            assert(player.dying, 'player should be dying');
            assertEqual(Math.round(player.x), Math.round(spot.x), 'player should not move on the hit frame');
        });

        deathTests.test('changing size keeps the sprite centred and out of walls', () => {
            initLevel();
            rebuildSolids();
            player.health = 2;
            const bigCentre = player.x + player.width / 2;
            player.health = 1;
            assertEqual(Math.round(player.x + player.width / 2), Math.round(bigCentre),
                'shrinking should keep the same centre');
            player.health = 2;
            assertEqual(Math.round(player.x + player.width / 2), Math.round(bigCentre),
                'growing should return to the same centre');

            // Growing hard against a wall must not leave the player inside it.
            const wall = blocks.find(b => b.type === 'solid' && !b.destroyed);
            player.health = 1;
            player.x = wall.x - player.width;          // flush against its left face
            player.y = wall.y;
            player.health = 2;
            assert(!solidCache.some(s => !s.oneWay && overlaps(player, s)),
                'growing next to a wall should push the player clear');
        });

        deathTests.test('the death animation holds still before falling away', () => {
            initLevel();
            player.health = 1;
            player.setInvulnerable(false);
            const startY = player.y;
            player.hit();
            for (let i = 0; i < CONFIG.DEATH_FREEZE - 1; i++) player.updateDeath();
            assertEqual(Math.round(player.y), Math.round(startY), 'body should hang still at first');
            for (let i = 0; i < 12; i++) player.updateDeath();
            assert(player.y < startY, 'body should pop upward after the pause');
        });

        deathTests.test('respawn only happens once the sequence finishes', () => {
            initLevel();
            gameState.lives = 3;
            player.health = 1;
            player.setInvulnerable(false);
            player.hit();
            assertEqual(gameState.lives, 2, 'a life is spent immediately');
            let guard = 0;
            while (player.dying && guard++ < 400) player.updateDeath();
            assert(!player.dying, 'death sequence should end');
            assert(player.health === 2, 'player returns at full size');
            assert(player.controlLock > 0, 'player gets a moment before control returns');
            assert(player.invulnerable, 'player returns briefly invulnerable');
        });

        deathTests.test('single player respawns on the last solid footing', () => {
            initLevel();
            gameState.lives = 3;
            // Walk the player onto a known patch of ground and let it register.
            const seg = platforms.filter(p => p.variant === 'ground')[1];
            player.x = seg.x + 200;
            player.y = seg.y - player.height;
            player.recordSafeGround(seg);

            player.health = 1;
            player.setInvulnerable(false);
            player.hit();
            let guard = 0;
            while (player.dying && guard++ < 400) player.updateDeath();

            assertEqual(Math.round(player.x), Math.round(seg.x + 200), 'respawn should return to the checkpoint');
            assertEqual(Math.round(player.y + player.height), Math.round(seg.y), 'respawn should be on the ground');
        });

        deathTests.test('a ledge edge is never used as a checkpoint', () => {
            initLevel();
            const seg = platforms.filter(p => p.variant === 'ground')[0];
            player.safeGround = null;
            player.x = seg.x + seg.width - player.width;   // right on the lip of the pit
            player.y = seg.y - player.height;
            player.recordSafeGround(seg);
            assert(!player.safeGround, 'the very edge of a ledge should not be a checkpoint');
        });

        deathTests.test('the death beat lasts long enough to register', () => {
            // Roughly a second and a half: long enough to see what happened.
            const frames = CONFIG.DEATH_FREEZE + CONFIG.DEATH_FALL;
            assert(frames >= 90, `death lasts only ${frames} frames`);
            assert(CONFIG.RESPAWN_READY >= 30, 'respawn grace is too short to be noticed');
        });

        // Test Suite 13: Collision courtesies
        const courtesyTests = new TestRunner('Collision Courtesies');

        courtesyTests.test('clipping a block corner slides past instead of stopping the jump', () => {
            const block = { x: 100, y: 0, width: 40, height: 40, oneWay: false };
            // Rising with only 6px of the body caught under the block's edge
            const body = { x: 66, y: 44, width: 40, height: 40, velocityX: 0, velocityY: -12, onGround: false };
            const hit = moveAndCollide(body, { solids: [block], cornerCorrection: CONFIG.CORNER_CORRECTION });
            assert(!hit.ceiling, 'a clipped corner should not count as a head-butt');
            assert(body.y < 44, 'the jump should keep rising');
            assert(body.x + body.width <= block.x + 0.5,
                `the body should be nudged clear of the block (right edge ${Math.round(body.x + body.width)})`);
        });

        courtesyTests.test('a square hit on a block still counts as a head-butt', () => {
            const block = { x: 100, y: 0, width: 40, height: 40, oneWay: false };
            const body = { x: 110, y: 44, width: 40, height: 40, velocityX: 0, velocityY: -12, onGround: false };
            const hit = moveAndCollide(body, { solids: [block], cornerCorrection: CONFIG.CORNER_CORRECTION });
            assert(hit.ceiling === block, 'a solid hit should report the ceiling');
            assertEqual(body.y, 40, 'the body should stop below the block');
        });

        courtesyTests.test('resolution pushes clear of every solid it touches', () => {
            // Two blocks side by side: stopping at the first used to leave the
            // body still embedded in the second.
            const a = { x: 100, y: 100, width: 40, height: 40, oneWay: false };
            const b = { x: 140, y: 100, width: 40, height: 40, oneWay: false };
            const body = { x: 60, y: 100, width: 40, height: 40, velocityX: 0, velocityY: 0, onGround: false };
            for (let i = 0; i < 30; i++) { body.velocityX = 6; moveAndCollide(body, { solids: [a, b] }); }
            assert(!overlaps(body, a) && !overlaps(body, b), 'body ended up inside a solid');
            assertEqual(Math.round(body.x + body.width), 100, 'body should rest against the first block');
        });

        // Test Suite 14: Enemy behaviour at edges
        const edgeTests = new TestRunner('Enemies at Edges');

        edgeTests.test('a walking turtle stops at a ledge', () => {
            initLevel();
            const seg = platforms.filter(p => p.variant === 'ground')[0];
            const turtle = new TurtleEnemy(seg.x + seg.width - 60, seg.y - CONFIG.ENEMY_SIZE);
            turtle.velocityX = 2;                 // heading for the drop
            enemies.push(turtle);
            rebuildSolids();
            for (let i = 0; i < 90; i++) turtle.update();
            assert(turtle.velocityX < 0, 'a walking turtle should turn back from the edge');
            assert(turtle.y < CONFIG.WORLD_HEIGHT, 'a walking turtle should not fall in');
        });

        edgeTests.test('a kicked shell sails off the edge instead of bouncing back', () => {
            initLevel();
            const seg = platforms.filter(p => p.variant === 'ground')[0];
            const turtle = new TurtleEnemy(seg.x + seg.width - 120, seg.y - CONFIG.ENEMY_SIZE);
            enemies.push(turtle);
            rebuildSolids();

            turtle.inShell = true;
            turtle.kickShell(true);               // kicked to the right, toward the pit
            assert(turtle.isShellSliding, 'shell should be sliding');
            assert(!turtle.avoidsLedges(), 'a sliding shell should ignore ledges');

            const startX = turtle.x;
            for (let i = 0; i < 120 && turtle.alive; i++) turtle.update();
            assert(turtle.x > startX, 'the shell should keep travelling toward the drop');
            assert(!turtle.alive || turtle.y > seg.y, 'the shell should have gone over the edge');
        });

        edgeTests.test('a shell that falls in a pit is gone, not scored', () => {
            initLevel();
            const seg = platforms.filter(p => p.variant === 'ground')[0];
            const turtle = new TurtleEnemy(seg.x + seg.width - 60, seg.y - CONFIG.ENEMY_SIZE);
            enemies.push(turtle);
            rebuildSolids();
            turtle.inShell = true;
            turtle.kickShell(true);
            const scoreBefore = gameState.score;
            for (let i = 0; i < 240 && turtle.alive; i++) turtle.update();
            assert(!turtle.alive, 'the shell should be gone');
            assertEqual(gameState.score, scoreBefore, 'falling in a pit should not award points');
        });

        // Test Suite 15: Shadows
        const shadowTests = new TestRunner('Cast Shadows');

        // Finds ground with nothing stacked above it, so the tests measure the
        // shadow logic rather than whatever block happens to be overhead.
        function openGroundColumn() {
            initLevel();
            rebuildSolids();
            const ground = platforms.filter(p => p.variant === 'ground');
            for (const seg of ground) {
                for (let x = seg.x + 40; x < seg.x + seg.width - 80; x += 20) {
                    const column = { x, y: 0, width: 40, height: seg.y - 4 };
                    const blocked = solidCache.some(sol => sol !== seg && overlaps(column, sol));
                    if (!blocked) return { seg, x };
                }
            }
            return null;
        }

        shadowTests.test('surfaceBelow finds the floor under a body', () => {
            const spot = openGroundColumn();
            assert(spot, 'level should have at least one open column');
            const box = { x: spot.x, y: 100, width: 40, height: 40 };
            assertEqual(surfaceBelow(box), spot.seg.y, 'should find the ground below');
        });

        shadowTests.test('surfaceBelow lands on the nearest surface, not the floor', () => {
            initLevel();
            rebuildSolids();
            // Directly under a block row, the shadow belongs on the block.
            const block = blocks.find(b => !b.destroyed && b.y < GROUND_Y - 80);
            const box = { x: block.x + 4, y: block.y - 200, width: 32, height: 40 };
            assertEqual(surfaceBelow(box), block.y, 'shadow should fall on the block, not the ground');
        });

        shadowTests.test('surfaceBelow reports nothing when there is no floor', () => {
            initLevel();
            rebuildSolids();
            const saved = solidCache;
            try {
                solidCache = [{ x: 0, y: 500, width: 100, height: 40 }];
                assertEqual(surfaceBelow({ x: 200, y: 100, width: 40, height: 40 }), null,
                    'a body over open air should cast no shadow');
                assertEqual(surfaceBelow({ x: 20, y: 100, width: 40, height: 40 }), 500,
                    'a body over a floor should find it');
                assertEqual(surfaceBelow({ x: 20, y: 600, width: 40, height: 40 }), null,
                    'a surface above the body is not below it');
            } finally {
                solidCache = saved;
            }
        });

        shadowTests.test('the shadow stays put as the body rises', () => {
            const spot = openGroundColumn();
            const low = { x: spot.x, y: spot.seg.y - 40, width: 40, height: 40 };
            const high = { x: spot.x, y: spot.seg.y - 200, width: 40, height: 40 };
            // Both resolve to the same surface: the shadow does not travel with
            // the jump the way a sprite-attached one did.
            assertEqual(surfaceBelow(low), surfaceBelow(high), 'shadow target should not move with the jump');
            assertEqual(surfaceBelow(high), spot.seg.y, 'shadow should stay on the ground');
        });

        // Test Suite 16: Hitbox fidelity
        // The collision box was a flat 40 wide while the artwork is 28, so a
        // third of the player was invisible padding that still bumped blocks.
        // This renders the sprite and scans it, so the two cannot drift apart.
        const hitboxTests = new TestRunner('Hitbox Fidelity');

        function spriteBounds(big) {
            const BOX = 200, ox = 80, oy = 80;
            const c = document.createElement('canvas');
            c.width = BOX; c.height = BOX;
            const g = c.getContext('2d');
            const w = big ? CONFIG.PLAYER_WIDTH : CONFIG.SMALL_PLAYER_WIDTH;
            const h = big ? CONFIG.PLAYER_SIZE : CONFIG.SMALL_PLAYER_HEIGHT;

            drawMarioSprite(g, {
                x: ox, y: oy, width: w, height: h, big, direction: 1,
                palette: PLAYER_COLORS[0], alpha: 1, squash: 1,
                onGround: true, velocityY: 0, walkPhase: 0, moving: false, skidding: false,
            });

            const data = g.getImageData(0, 0, BOX, BOX).data;
            let minX = 1e9, maxX = -1e9;
            for (let y = 0; y < BOX; y++) {
                for (let x = 0; x < BOX; x++) {
                    if (data[(y * BOX + x) * 4 + 3] > 12) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                    }
                }
            }
            return { left: minX - ox, right: (ox + w) - maxX, width: maxX - minX + 1, box: w };
        }

        hitboxTests.test('big Mario\'s box matches his artwork', () => {
            const b = spriteBounds(true);
            assert(Math.abs(b.left) <= 2, `${b.left}px of empty box on the left`);
            assert(Math.abs(b.right) <= 2, `${b.right}px of empty box on the right`);
        });

        hitboxTests.test('small Mario\'s box matches his artwork', () => {
            const b = spriteBounds(false);
            assert(Math.abs(b.left) <= 2, `${b.left}px of empty box on the left`);
            assert(Math.abs(b.right) <= 2, `${b.right}px of empty box on the right`);
        });

        hitboxTests.test('the player is narrower than a grid cell', () => {
            // A body as wide as the cell cannot fit through a one-cell gap
            // without pixel-perfect alignment.
            assert(CONFIG.PLAYER_WIDTH < GRID, 'player should fit inside a grid cell');
            assert(CONFIG.SMALL_PLAYER_WIDTH < CONFIG.PLAYER_WIDTH, 'small should be narrower than big');
        });

        hitboxTests.test('a block only reacts when the body actually reaches it', () => {
            initLevel();
            rebuildSolids();
            const block = blocks.find(b => b.type === 'question' && !b.used);
            const body = {
                x: block.x + block.width + 1,        // clear of the block, to its right
                y: block.y + block.height + 4,
                width: CONFIG.PLAYER_WIDTH, height: CONFIG.PLAYER_SIZE,
                velocityX: 0, velocityY: -12, onGround: false,
            };
            const hit = moveAndCollide(body, { solids: [block], cornerCorrection: CONFIG.CORNER_CORRECTION });
            assert(!hit.ceiling, 'a body beside the block should not bump it');
        });

        // Test Suite 17: Enemy population
        const populationTests = new TestRunner('Enemy Population');

        populationTests.test('hoppers stop at a drop rather than leaping in', () => {
            const hopper = new JumpingEnemy(0, 0);
            assert(hopper.avoidsLedges(), 'jumping enemies should respect ledges');
        });

        populationTests.test('falling in a pit is permanent', () => {
            initLevel();
            rebuildSolids();
            const e = enemies[0];
            e.alive = true;
            e.despawn();
            assert(!e.alive, 'the enemy should be gone');
            assertEqual(e.respawnTime, null, 'a pit fall should not queue a respawn');
        });

        populationTests.test('a stomped enemy does still come back', () => {
            initLevel();
            const e = enemies.find(en => en.constructor.name === 'Enemy');
            e.alive = true;
            e.die(false);
            assert(e.respawnTime, 'stomped enemies should respawn to keep the level alive');
        });

        populationTests.test('pipes are rate limited', () => {
            assert(CONFIG.PORTAL_SPAWN_MIN >= 600, 'pipes should wait at least 10s between spawns');
            assert(CONFIG.MAX_ENEMIES_PER_TYPE <= 4, 'too many of one enemy type allowed at once');
        });

        populationTests.test('a pipe will not spawn past the cap', () => {
            initLevel();
            const portal = portals[0];
            const type = portal.enemyType;
            // Fill the level past the cap for this type
            for (let i = 0; i < CONFIG.MAX_ENEMIES_PER_TYPE + 2; i++) {
                enemies.push(createEnemy(type, 200 + i * 60, GROUND_Y - CONFIG.ENEMY_SIZE));
            }
            portal.spawnCooldown = 0;
            portal.spawning = false;
            const before = enemies.length;
            portal.update();
            assert(!portal.spawning, 'the pipe should hold off while the cap is reached');
            assertEqual(enemies.length, before, 'no enemy should have been added');
        });

        // Test Suite 18: PWA
        const pwaTests = new TestRunner('PWA Support');

        pwaTests.test('Manifest link exists', () => {
            const manifest = document.querySelector('link[rel="manifest"]');
            assert(manifest, 'Manifest link not found');
        });

        pwaTests.test('Service worker registration attempted', () => {
            assert('serviceWorker' in navigator, 'Service Worker not supported');
        });

        // Run all tests
        async function runAllTests() {
            const suites = [
                domTests,
                gameStateTests,
                configTests,
                functionTests,
                audioTests,
                hapticTests,
                mathTests,
                collisionTests,
                levelTests,
                blockTests,
                geometryTests,
                deathTests,
                courtesyTests,
                edgeTests,
                shadowTests,
                hitboxTests,
                populationTests,
                pwaTests
            ];

            const allResults = [];
            for (const suite of suites) {
                const result = await suite.run();
                allResults.push(result);
            }

            displayResults(allResults);
        }

        function displayResults(allResults) {
            const container = document.getElementById('test-results');
            let totalTests = 0;
            let passedTests = 0;
            let failedTests = 0;

            allResults.forEach(({ suite, results }) => {
                const suiteDiv = document.createElement('div');
                suiteDiv.className = 'test-suite';

                const title = document.createElement('h2');
                title.textContent = suite;
                suiteDiv.appendChild(title);

                results.forEach(test => {
                    totalTests++;
                    const testDiv = document.createElement('div');
                    testDiv.className = `test-case ${test.status}`;

                    const status = test.status === 'pass' ? '✓' : '✗';
                    testDiv.innerHTML = `<strong>${status} ${test.name}</strong>`;

                    if (test.error) {
                        failedTests++;
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error-details';
                        errorDiv.textContent = test.error;
                        testDiv.appendChild(errorDiv);
                    } else {
                        passedTests++;
                    }

                    suiteDiv.appendChild(testDiv);
                });

                container.appendChild(suiteDiv);
            });

            const summary = document.createElement('div');
            summary.className = 'summary';
            summary.innerHTML = `
                <div>Total Tests: ${totalTests}</div>
                <div style="color: #4caf50;">Passed: ${passedTests}</div>
                <div style="color: #f44336;">Failed: ${failedTests}</div>
                <div style="margin-top: 10px;">Success Rate: ${Math.round(passedTests/totalTests * 100)}%</div>
            `;
            container.appendChild(summary);
        }

        // Wait for game to load, then run tests
        window.addEventListener('load', () => {
            setTimeout(() => {
                runAllTests();
            }, 500);
        });
    </script>

    <!-- Load game scripts -->
    <canvas id="gameCanvas" style="display:none;"></canvas>
    <div id="touch-controls" style="display:none;">
        <button id="btn-left"></button>
        <button id="btn-right"></button>
        <button id="btn-jump"></button>
    </div>
    <div id="start-screen" style="display:none;">
        <button id="start-btn"></button>
    </div>
    <div id="game-ui" style="display:none;">
        <div><span id="score"></span></div>
        <div><span id="coins"></span></div>
        <div><span id="lives"></span></div>
        <div><span id="level"></span></div>
        <div class="time"><span id="time"></span></div>
        <div><span id="combo"></span></div>
    </div>
    <script src="game.js"></script>
</body>
