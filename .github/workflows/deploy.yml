name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      # The repository's current default branch. GitHub Pages only accepts
      # deployments from the default branch, so the previous 'claude/**'
      # wildcard queued a run on every feature branch that was rejected by the
      # github-pages environment before a runner was even assigned - a red X on
      # every push that never built anything. Rename the default branch to
      # `main` and this line can go.
      - claude/mario-clone-touch-game-011CUqLq96M8PWbcMhjpPjrZ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
