<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mario Clone">
    <meta name="theme-color" content="#E52521">
    <link rel="manifest" href="manifest.json">
    <title>Mario Clone - Touch Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="touch-controls">
            <div class="controls-left">
                <button id="btn-left" class="control-btn direction-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <button id="btn-right" class="control-btn direction-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>
            <div class="controls-right">
                <button id="btn-jump" class="control-btn action-btn">
                    <span>JUMP</span>
                </button>
            </div>
        </div>
        <div id="game-ui">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="coins">Coins: <span id="coins">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
        </div>
        <div id="start-screen" class="screen">
            <h1>Mario Clone</h1>
            <p>Touch Edition</p>
            <button id="start-btn" class="menu-btn">Start Game</button>
        </div>
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="menu-btn">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        // Register service worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Mario-clone/sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
